services:
  - type: web
    name: polaris-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_URL
        value: "https://your-vercel-frontend-url.vercel.app" # Will be updated with Vercel deployment URL
      - key: GEMINI_API_KEY
        sync: false # Must be provided manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.10.0"
